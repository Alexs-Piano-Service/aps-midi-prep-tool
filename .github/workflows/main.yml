name: Release Windows (Signed)

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  actions: read

jobs:
  build-sign-upload:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require cross-platform CI for this commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_gate.py --repo "$env:GITHUB_REPOSITORY" --sha (git rev-parse HEAD)

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements-build.txt) {
            pip install -r requirements-build.txt
          } elseif (Test-Path requirements.txt) {
            pip install -r requirements.txt
            pip install pyinstaller
          } else {
            pip install pyinstaller
          }

      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install -r requirements-test.txt

      - name: Install image tools for regression tests
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-mtools

      - name: Expose image tools to Python
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $toolDirectory = Join-Path $env:MSYS2_LOCATION 'ucrt64\bin'
          foreach ($tool in 'mformat', 'mcopy', 'mdir', 'mdel', 'mren') {
            $toolPath = Join-Path $toolDirectory "$tool.exe"
            if (!(Test-Path -LiteralPath $toolPath)) { throw "Missing Windows image tool: $toolPath" }
          }
          Add-Content $env:GITHUB_PATH $toolDirectory

      - name: Install HFE test dependency
        shell: pwsh
        run: ./scripts/stage_windows_hfe_tool.ps1 -Destination "$env:RUNNER_TEMP/aps-hfe"

      - name: Verify image tools are available
        shell: pwsh
        run: python -c "import shutil; assert all(shutil.which(name) for name in ('mformat', 'mcopy', 'mdir', 'mdel', 'mren', 'gw')), 'mtools and Greaseweazle are required for image regression tests'"

      - name: Run automated tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Install LAME
        shell: pwsh
        run: |
          choco install lame -y --no-progress
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")
          lame --version

      - name: Build Windows EXE
        shell: pwsh
        run: |
          $pyInstallerArgs = @(
            "--noconfirm",
            "--onefile",
            "--windowed",
            "--name", "APSMIDIPrepTool",
            "--icon", "aps_midi_prep_tool_app/aps.ico",
            "--manifest", "manifests/main_as_invoker.xml"
          )
          foreach ($toolName in @("mformat", "mcopy", "mdir", "mdel", "mren")) {
            $toolPath = (Get-Command "$toolName.exe" -ErrorAction Stop).Source
            $pyInstallerArgs += @("--add-binary", "$toolPath;aps_midi_prep_tool_app/bin/mtools")
          }
          $gwExe = "aps_midi_prep_tool_app/bin/greaseweazle/gw.exe"
          if (Test-Path $gwExe) {
            $pyInstallerArgs += @("--add-binary", "$gwExe;aps_midi_prep_tool_app/bin/greaseweazle")
          }
          $lameExe = (Get-Command lame.exe -ErrorAction SilentlyContinue).Source
          if (-not $lameExe) {
            $lameExe = Get-ChildItem "$env:ChocolateyInstall/lib/lame/tools" -Recurse -Filter lame.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $lameExe) { throw "LAME was not found after installation." }
          $pyInstallerArgs += @("--add-binary", "$lameExe;bin")
          pyinstaller @pyInstallerArgs aps_midi_prep_tool.py

      - name: Install AzureSignTool
        shell: pwsh
        run: dotnet tool install --global AzureSignTool

      - name: Sign EXE with Trusted Signing
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
        run: |
          $exe = "dist/APSMIDIPrepTool.exe"
          if (!(Test-Path $exe)) { throw "Build output not found: $exe" }

          azuresigntool sign `
            -kvu "$env:AZURE_TRUSTED_SIGNING_ENDPOINT" `
            -kvi "$env:AZURE_CLIENT_ID" `
            -kvt "$env:AZURE_TENANT_ID" `
            -kvs "$env:AZURE_CLIENT_SECRET" `
            -tr "http://timestamp.acs.microsoft.com" `
            -td sha256 `
            -fd sha256 `
            -dlib "Azure.CodeSigning.Dlib.dll" `
            -dmdf "$env:AZURE_TRUSTED_SIGNING_ACCOUNT/$env:AZURE_TRUSTED_SIGNING_PROFILE" `
            "$exe"

      - name: Verify signature
        shell: pwsh
        run: |
          $exe = "dist/APSMIDIPrepTool.exe"
          Get-AuthenticodeSignature $exe | Format-List

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: APSMIDIPrepTool-windows-signed
          path: dist/APSMIDIPrepTool.exe

      - name: Attach signed EXE to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/APSMIDIPrepTool.exe
