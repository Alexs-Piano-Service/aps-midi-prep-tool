name: Release Windows (Signed)

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional validated tag to package and stage as a draft'
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build-sign-upload:
    # Automatically sign only successful main-branch pushes in the public repo.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.repository == 'Alexs-Piano-Service/aps-midi-prep-tool' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # main may have advanced while CI ran; package the commit CI tested.
          ref: ${{ inputs.release_tag || github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require cross-platform CI for this commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $gateArgs = @('--repo', $env:GITHUB_REPOSITORY, '--sha', (git rev-parse HEAD))
          if ($env:RELEASE_TAG) { $gateArgs += @('--tag', $env:RELEASE_TAG) }
          elseif ($env:GITHUB_REF_TYPE -eq 'tag') { $gateArgs += @('--tag', $env:GITHUB_REF_NAME) }
          python scripts/release_gate.py @gateArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release gate failed.' }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements-build.txt) {
            pip install -r requirements-build.txt
          } elseif (Test-Path requirements.txt) {
            pip install -r requirements.txt
            pip install pyinstaller
          } else {
            pip install pyinstaller
          }

      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install -r requirements-test.txt

      - name: Install image tools and MP3 encoder
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-mtools
            mingw-w64-ucrt-x86_64-lame

      - name: Expose image tools to Python
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $toolDirectory = Join-Path $env:MSYS2_LOCATION 'ucrt64\bin'
          foreach ($tool in 'mformat', 'mcopy', 'mdir', 'mdel', 'mren') {
            $toolPath = Join-Path $toolDirectory "$tool.exe"
            if (!(Test-Path -LiteralPath $toolPath)) { throw "Missing Windows image tool: $toolPath" }
          }
          Add-Content -Path $env:GITHUB_PATH -Value $toolDirectory -Encoding utf8

      - name: Stage MP3 encoder
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: ./scripts/stage_windows_lame.ps1 -SourceDirectory (Join-Path $env:MSYS2_LOCATION 'ucrt64/bin') -Destination "$env:RUNNER_TEMP/aps-lame"

      - name: Install HFE test dependency
        shell: pwsh
        run: ./scripts/stage_windows_hfe_tool.ps1 -Destination "$env:RUNNER_TEMP/aps-hfe"

      - name: Verify image tools are available
        shell: pwsh
        run: python scripts/check_mtools.py

      - name: Verify HFE helper is available
        shell: pwsh
        run: gw convert --help

      - name: Run automated tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --ignore=tests/windows

      - name: Run native Windows image, audio, and process tests
        run: python -m pytest -q tests/windows --windows-require-tools

      - name: Build portable Windows manual test kit
        run: python -m scripts.build_windows_test_kit --output dist/windows-test-kit

      - name: Archive portable Windows manual test kit
        shell: pwsh
        run: Compress-Archive -Path dist/windows-test-kit/* -DestinationPath dist/windows-test-kit.zip

      - name: Build Windows EXE
        shell: pwsh
        run: ./build/build_windows_main.ps1 -OneFile -Name APSMIDIPrepTool

      - name: Require Windows EXE
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath "dist/APSMIDIPrepTool.exe" -PathType Leaf)) {
            throw "Build output not found: dist/APSMIDIPrepTool.exe"
          }

      - name: Sign EXE with Trusted Signing
        uses: azure/trusted-signing-action@v0.5.9
        with:
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT || secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT || secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE || secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signature
        shell: pwsh
        run: |
          $exe = "dist/APSMIDIPrepTool.exe"
          $sig = Get-AuthenticodeSignature -LiteralPath $exe -ErrorAction Stop
          $sig | Format-List
          if ($sig.Status -ne 'Valid') {
            throw "Signature invalid for ${exe}: $($sig.Status) - $($sig.StatusMessage)"
          }

      - name: Exercise the signed package without development tools on PATH
        shell: pwsh
        timeout-minutes: 6
        run: |
          $metadata = Get-Content packaging/release.json -Raw | ConvertFrom-Json
          ./scripts/test_windows_package.ps1 -ExecutablePath dist/APSMIDIPrepTool.exe -OutputDirectory "$env:RUNNER_TEMP/aps-package-smoke" -ExpectedVersion $metadata.version

      - name: Upload package smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-smoke
          path: ${{ runner.temp }}/aps-package-smoke/
          if-no-files-found: warn

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: APSMIDIPrepTool-windows-signed
          path: |
            dist/APSMIDIPrepTool.exe
            dist/windows-test-kit.zip
          if-no-files-found: error

      - name: Stage signed EXE and test kit in a draft release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/release_assets.py stage "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --files dist/APSMIDIPrepTool.exe dist/windows-test-kit.zip
