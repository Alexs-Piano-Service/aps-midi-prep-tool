name: Release Windows (Signed)

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  actions: read

jobs:
  build-sign-upload:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require cross-platform CI for this commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_gate.py --repo "$env:GITHUB_REPOSITORY" --sha (git rev-parse HEAD)

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements-build.txt) {
            pip install -r requirements-build.txt
          } elseif (Test-Path requirements.txt) {
            pip install -r requirements.txt
            pip install pyinstaller
          } else {
            pip install pyinstaller
          }

      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install -r requirements-test.txt

      - name: Install image tools and MP3 encoder
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-mtools
            mingw-w64-ucrt-x86_64-lame

      - name: Expose image tools to Python
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $toolDirectory = Join-Path $env:MSYS2_LOCATION 'ucrt64\bin'
          foreach ($tool in 'mformat', 'mcopy', 'mdir', 'mdel', 'mren') {
            $toolPath = Join-Path $toolDirectory "$tool.exe"
            if (!(Test-Path -LiteralPath $toolPath)) { throw "Missing Windows image tool: $toolPath" }
          }
          Add-Content $env:GITHUB_PATH $toolDirectory

      - name: Stage MP3 encoder
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: ./scripts/stage_windows_lame.ps1 -SourceDirectory (Join-Path $env:MSYS2_LOCATION 'ucrt64/bin') -Destination "$env:RUNNER_TEMP/aps-lame"

      - name: Install HFE test dependency
        shell: pwsh
        run: ./scripts/stage_windows_hfe_tool.ps1 -Destination "$env:RUNNER_TEMP/aps-hfe"

      - name: Verify image tools are available
        shell: pwsh
        run: python -c "import shutil; assert all(shutil.which(name) for name in ('mformat', 'mcopy', 'mdir', 'mdel', 'mren', 'gw')), 'mtools and Greaseweazle are required for image regression tests'"

      - name: Run automated tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --ignore=tests/windows

      - name: Run native Windows image, audio, and process tests
        run: python -m pytest -q tests/windows --windows-require-tools

      - name: Build portable Windows manual test kit
        run: python -m scripts.build_windows_test_kit --output dist/windows-test-kit

      - name: Archive portable Windows manual test kit
        shell: pwsh
        run: Compress-Archive -Path dist/windows-test-kit/* -DestinationPath dist/windows-test-kit.zip

      - name: Build Windows EXE
        shell: pwsh
        run: |
          $pyInstallerArgs = @(
            "--noconfirm",
            "--onefile",
            "--windowed",
            "--name", "APSMIDIPrepTool",
            "--icon", "aps_midi_prep_tool_app/aps.ico",
            "--manifest", "manifests/main_as_invoker.xml"
          )
          foreach ($toolName in @("mformat", "mcopy", "mdir", "mdel", "mren")) {
            $toolPath = (Get-Command "$toolName.exe" -ErrorAction Stop).Source
            $pyInstallerArgs += @("--add-binary", "$toolPath;aps_midi_prep_tool_app/bin/mtools")
          }
          # The standalone helper needs its lib directory, DLLs, and licenses.
          $gwDirectory = $env:APS_WINDOWS_GW_DIR
          if (!(Test-Path -LiteralPath (Join-Path $gwDirectory 'gw.exe'))) { throw 'Standalone Greaseweazle is missing.' }
          $pyInstallerArgs += @("--add-data", "$gwDirectory;aps_midi_prep_tool_app/bin/greaseweazle")
          # Package the exact encoder/DLL bundle exercised by native Windows CI.
          $lameDirectory = $env:APS_WINDOWS_LAME_DIR
          if (!(Test-Path -LiteralPath (Join-Path $lameDirectory 'lame.exe'))) { throw 'Staged LAME is missing.' }
          $pyInstallerArgs += @("--add-data", "$lameDirectory;bin")
          pyinstaller @pyInstallerArgs aps_midi_prep_tool.py

      - name: Require Windows EXE
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath "dist/APSMIDIPrepTool.exe" -PathType Leaf)) {
            throw "Build output not found: dist/APSMIDIPrepTool.exe"
          }

      - name: Sign EXE with Trusted Signing
        uses: azure/trusted-signing-action@v0.5.9
        with:
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT || secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT || secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE || secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signature
        shell: pwsh
        run: |
          $exe = "dist/APSMIDIPrepTool.exe"
          $sig = Get-AuthenticodeSignature -LiteralPath $exe -ErrorAction Stop
          $sig | Format-List
          if ($sig.Status -ne 'Valid') {
            throw "Signature invalid for ${exe}: $($sig.Status) - $($sig.StatusMessage)"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: APSMIDIPrepTool-windows-signed
          path: |
            dist/APSMIDIPrepTool.exe
            dist/windows-test-kit.zip

      - name: Attach signed EXE to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/APSMIDIPrepTool.exe
            dist/windows-test-kit.zip
