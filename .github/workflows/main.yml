name: Release Windows (Signed)

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  actions: read

jobs:
  build-sign-upload:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require cross-platform CI for this commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_gate.py --repo "$env:GITHUB_REPOSITORY" --sha (git rev-parse HEAD)

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements-build.txt) {
            pip install -r requirements-build.txt
          } elseif (Test-Path requirements.txt) {
            pip install -r requirements.txt
            pip install pyinstaller
          } else {
            pip install pyinstaller
          }

      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install -r requirements-test.txt

      - name: Install image tools for regression tests
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-mtools

      - name: Expose image tools to Python
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH 'C:\msys64\ucrt64\bin'

      - name: Run automated tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Install LAME
        shell: pwsh
        run: |
          choco install lame -y --no-progress
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")
          lame --version

      - name: Build Windows EXE
        shell: pwsh
        run: |
          $pyInstallerArgs = @(
            "--noconfirm",
            "--onefile",
            "--windowed",
            "--name", "APSMIDIPrepTool",
            "--icon", "aps_midi_prep_tool_app/aps.ico",
            "--manifest", "manifests/main_as_invoker.xml"
          )
          foreach ($toolName in @("mformat", "mcopy", "mdir", "mdel", "mren")) {
            $toolPath = (Get-Command "$toolName.exe" -ErrorAction Stop).Source
            $pyInstallerArgs += @("--add-binary", "$toolPath;aps_midi_prep_tool_app/bin/mtools")
          }
          $gwExe = "aps_midi_prep_tool_app/bin/greaseweazle/gw.exe"
          if (Test-Path $gwExe) {
            $pyInstallerArgs += @("--add-binary", "$gwExe;aps_midi_prep_tool_app/bin/greaseweazle")
          }
          $lameExe = (Get-Command lame.exe -ErrorAction SilentlyContinue).Source
          if (-not $lameExe) {
            $lameExe = Get-ChildItem "$env:ChocolateyInstall/lib/lame/tools" -Recurse -Filter lame.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $lameExe) { throw "LAME was not found after installation." }
          $pyInstallerArgs += @("--add-binary", "$lameExe;bin")
          pyinstaller @pyInstallerArgs aps_midi_prep_tool.py

      - name: Require Windows EXE
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath "dist/APSMIDIPrepTool.exe" -PathType Leaf)) {
            throw "Build output not found: dist/APSMIDIPrepTool.exe"
          }

      - name: Sign EXE with Trusted Signing
        uses: azure/trusted-signing-action@v0.5.9
        with:
          endpoint: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT || secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT || secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE || secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signature
        shell: pwsh
        run: |
          $exe = "dist/APSMIDIPrepTool.exe"
          $sig = Get-AuthenticodeSignature -LiteralPath $exe -ErrorAction Stop
          $sig | Format-List
          if ($sig.Status -ne 'Valid') {
            throw "Signature invalid for ${exe}: $($sig.Status) - $($sig.StatusMessage)"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: APSMIDIPrepTool-windows-signed
          path: dist/APSMIDIPrepTool.exe

      - name: Attach signed EXE to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/APSMIDIPrepTool.exe
