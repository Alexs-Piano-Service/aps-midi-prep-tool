name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install Linux image and Qt dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mtools libegl1 libopengl0 libpulse0
      - name: Install Windows image tools
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-mtools
      - name: Expose Windows image tools to Python
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $toolDirectory = Join-Path $env:MSYS2_LOCATION 'ucrt64\bin'
          foreach ($tool in 'mformat', 'mcopy', 'mdir', 'mdel', 'mren') {
            $toolPath = Join-Path $toolDirectory "$tool.exe"
            if (!(Test-Path -LiteralPath $toolPath)) { throw "Missing Windows image tool: $toolPath" }
            Write-Host "$tool -> $toolPath"
          }
          Add-Content $env:GITHUB_PATH $toolDirectory
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Verify image tools are available
        run: python -c "import shutil; assert all(shutil.which(name) for name in ('mformat', 'mcopy', 'mdir', 'mdel', 'mren')), 'mtools is required for image regression tests'"
      - name: Check Python syntax
        run: python -m compileall -q aps_midi_prep_tool.py aps_midi_prep_tool_app scripts
      - name: Run automated tests
        run: python -m pytest -q --ignore=tests/windows --junitxml=test-results/regression.xml
      - name: Install Windows HFE test dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/stage_windows_hfe_tool.ps1 -Destination "$env:RUNNER_TEMP/aps-hfe"
      - name: Run native Windows image and process tests
        if: runner.os == 'Windows'
        run: python -m pytest -q tests/windows --windows-require-tools --junitxml=test-results/windows.xml
      - name: Build portable Windows manual test kit
        if: runner.os == 'Windows'
        run: python -m scripts.build_windows_test_kit --output dist/windows-test-kit
      - name: Upload Windows manual test kit
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-kit
          path: dist/windows-test-kit/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/*.xml
          if-no-files-found: warn
      - name: Check whitespace
        run: git diff --check
      - name: Check AppImage build script
        if: runner.os == 'Linux'
        run: bash -n scripts/build_appimage.sh
