name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install Linux image and Qt dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mtools libegl1 libopengl0
      - name: Install Windows image tools
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-mtools
      - name: Expose Windows image tools to Python
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH 'C:\msys64\ucrt64\bin'
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Verify image tools are available
        run: python -c "import shutil; assert all(shutil.which(name) for name in ('mformat', 'mcopy', 'mdir', 'mdel', 'mren')), 'mtools is required for image regression tests'"
      - name: Check Python syntax
        run: python -m compileall -q aps_midi_prep_tool.py aps_midi_prep_tool_app scripts
      - name: Run automated tests
        run: python -m pytest -q
      - name: Check whitespace
        run: git diff --check
      - name: Check AppImage build script
        if: runner.os == 'Linux'
        run: bash -n scripts/build_appimage.sh
